[project]
name = "igdm"
version = "0.1.0"
description = "Instagram comment to DM automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tomlkit>=0.15.2",
]

[project.scripts]
igdm = "igdm.cli:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "private/tests"]

[dependency-groups]
dev = [
    "pytest>=8",
]
